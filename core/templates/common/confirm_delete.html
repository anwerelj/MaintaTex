{% extends 'common/base.html' %}

{% block title %}Confirm deletion{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a href="{% url cancel_url %}" class="btn back-button btn-sm" aria-label="Back to previous list">
    <span aria-hidden="true">&larr;</span> Back
  </a>
  <h2 class="mb-0">Confirm deletion</h2>
</div>

<div class="card border-danger form-card">
  <div class="card-body">
    <p>Are you sure you want to delete {{ object_name }}? This action cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, delete</button>
    </form>
  </div>
</div>
{% endblock %}
